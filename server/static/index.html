<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>labHandler</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2329322d'/%3E%3Cpath d='M15 10v12l-5 8h20l-5-8V10m-12 0h14M14 24h12' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/activity.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3v8l-5 8a1.3 1.3 0 0 0 1 2h14a1.3 1.3 0 0 0 1-2l-5-8V3M7 3h10M7.5 15h9"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M5 4h14v17l-7-4-7 4zM9 8h6M9 11h4"/></symbol>
    <symbol id="i-skill" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8zM14 3v5h5M8 13h8M8 17h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-clean" viewBox="0 0 24 24"><path d="m16 3 5 5-10 10-5-5zM6 13l-3 7 7-2M15 20h6"/></symbol>
  </svg>
  <a class="skip-link" href="#main">跳到主内容</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="labHandler 首页"><span class="brand-mark"><svg><use href="#i-lab"/></svg></span><span>labHandler</span></a>
    <nav aria-label="主导航">
      <button id="tabTask" class="active" aria-current="page"><svg><use href="#i-grid"/></svg>Lab</button>
      <button id="tabRemember"><svg><use href="#i-memory"/></svg>偏好</button>
      <button id="tabSkill"><svg><use href="#i-skill"/></svg>技能</button>
    </nav>
    <div class="sidebar-bottom">
      <button id="themeToggle" class="theme-toggle ghost"><svg><use href="#i-sun"/></svg><span>切换深色外观</span></button>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div><span class="breadcrumb">workspace</span><span class="slash">/</span><span id="pageName">Lab</span></div><span id="stateBadge" class="state-badge"><span class="dot"></span><span id="stateLabel">就绪</span></span></header>
    <main id="main">
      <div id="viewTask">
        <div class="page-heading"><h1>Lab</h1></div>
        <div id="resumeNotice" class="notice hidden" role="status"><div><strong>上次的 lab 尚未完成</strong></div><div class="row"><button id="resumeBtn">继续</button><button id="discardBtn" class="ghost">归档</button></div></div>
        <div class="task-layout">
          <section id="secTask" class="composer">
            <div class="section-heading"><h2>指令</h2></div>
            <label for="question" class="sr-only">Lab 要求</label>
            <textarea id="question" rows="5" placeholder="想在这个 lab 中做什么？"></textarea>
            <div class="composer-footer"><span id="status" role="status">⌘ / Ctrl + Enter</span><div class="row"><button id="stopbtn" class="ghost hidden" disabled>停止</button><button id="run" disabled>开始<svg><use href="#i-arrow"/></svg></button></div></div>
          </section>
          <section id="secUpload" class="materials">
            <div class="section-heading"><h2>文件</h2><span id="fileCount" class="count">0</span></div>
            <button id="drop" class="dropzone" type="button" title="点击上传或拖入文件"><span class="upload-icon"><svg><use href="#i-upload"/></svg></span><strong>添加文件</strong></button>
            <input type="file" id="fileinput" multiple class="hidden" aria-label="选择 lab 文件">
            <ul id="filelist" class="files" aria-label="工作区文件"></ul>
          </section>
          <section id="secProgress" class="hidden progress-section"><div class="section-heading"><h2>进度</h2><span class="subtle" id="progressLabel" role="status"></span></div><div id="log" aria-label="Lab 运行进度" tabindex="0"></div></section>
          <section id="secResult" class="hidden result-section"><div class="section-heading"><h2>结果</h2></div><div id="verdict"></div><ul id="filelist2" class="files" aria-label="Lab 产物"></ul><div id="summary"></div><div class="result-footer"><button id="donebtn" class="ghost">归档 lab<svg><use href="#i-arrow"/></svg></button></div></section>
        </div>
      </div>
      <div id="viewRemember" class="hidden settings-view">
        <div class="page-heading"><h1>偏好</h1></div>
        <section id="secProfile"><div class="section-heading"><h2>已保存</h2></div><ul id="ruleList" class="files rules"></ul><label for="ruleInput" class="sr-only">添加偏好</label><div class="row rule-form"><input id="ruleInput" type="text" placeholder="添加偏好…"><button id="ruleAdd">保存</button></div></section>
        <section class="maintenance"><div><h2>知识</h2></div><button id="dreambtn" class="ghost" title="合并、去重归档知识"><svg><use href="#i-clean"/></svg>整理</button></section>
      </div>
      <div id="viewSkill" class="hidden settings-view">
        <div class="page-heading"><h1>技能</h1></div>
        <div id="skillNotice" class="notice hidden">lab 运行中，暂不可编辑。</div>
        <section id="secSkill"><div class="section-heading"><h2>编辑流程</h2></div><label for="skillSel">选择技能</label><select id="skillSel" aria-label="选择技能"></select><label for="skillInstr">修改要求</label><textarea id="skillInstr" rows="5" placeholder="描述需要调整的流程…" title="可引用已上传的文风样本文件名"></textarea><div class="skill-toolbar"><span id="skillStatus" role="status"></span><button id="skillPropose">预览修改<svg><use href="#i-arrow"/></svg></button></div><div id="skillMsg" role="status"></div><div id="skillDiffs"></div><div class="row hidden" id="skillActions"><button id="skillApply">应用</button><button id="skillCancel" class="ghost">取消</button></div></section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
