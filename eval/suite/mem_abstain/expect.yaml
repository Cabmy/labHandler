    title: MiniKV WAL
    content: |
      MiniKV 的 WAL 在崩溃恢复时要重放 put 与 delete。TTL 过期的键不要在重启后复活。
      接口是 kv_put、kv_get、kv_delete。存储文件名是 minikv.wal。
